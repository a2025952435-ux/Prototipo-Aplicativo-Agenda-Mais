kind = "mobile"
previewPath = "/"
title = "AgendaMais+"
description = "Aplicativo mobile demonstrativo para idosos com fluxos acessíveis de consultas fictícias, leitura visual simulada e preferências locais. Não oferece atendimento médico real."
version = "1.0.0"
id = "artifacts/agendamais-plus"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24040

[services.development]
run = "pnpm --filter @workspace/agendamais-plus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agendamais-plus", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/agendamais-plus", "run", "serve" ]

[services.env]
PORT = "24040"
BASE_PATH = "/"
